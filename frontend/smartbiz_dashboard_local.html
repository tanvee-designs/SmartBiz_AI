<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartBiz AI — Automation Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEEF1; --card:#F8F8FA; --ink:#0F0F12; --muted:#6A6A74; --line:#E1E1E6; --bd:rgba(15,15,25,.06);
  --pill:#0F0F12; --pill-ink:#FFFFFF; --amber:#F0A94E; --track:#E4E4E9; --soft:#EFEFF3;
  --ok-bg:#D5F3CF; --ok-ink:#1B6212; --warn-bg:#FCE3BF; --warn-ink:#87480A; --bad-bg:#FBD5D1; --bad-ink:#9B1C12;
  --sh:0 1px 0 #fff inset,0 1px 2px rgba(20,20,30,.04),0 12px 32px rgba(20,20,30,.07); --spot:rgba(255,255,255,.7);
  --ease:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C0C0F; --card:#17171B; --ink:#F3F3F6; --muted:#9A9AA5; --line:#2A2A31; --bd:rgba(255,255,255,.07);
    --pill:#F3F3F6; --pill-ink:#0F0F12; --amber:#E8A44A; --track:#2A2A31; --soft:#202026;
    --ok-bg:#1E3C1A; --ok-ink:#A9F0A0; --warn-bg:#4A3213; --warn-ink:#FFD59A; --bad-bg:#4A1A16; --bad-ink:#FFB3AB;
    --sh:0 1px 0 rgba(255,255,255,.05) inset,0 12px 32px rgba(0,0,0,.45); --spot:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C0C0F; --card:#17171B; --ink:#F3F3F6; --muted:#9A9AA5; --line:#2A2A31; --bd:rgba(255,255,255,.07);
  --pill:#F3F3F6; --pill-ink:#0F0F12; --amber:#E8A44A; --track:#2A2A31; --soft:#202026;
  --ok-bg:#1E3C1A; --ok-ink:#A9F0A0; --warn-bg:#4A3213; --warn-ink:#FFD59A; --bad-bg:#4A1A16; --bad-ink:#FFB3AB;
  --sh:0 1px 0 rgba(255,255,255,.05) inset,0 12px 32px rgba(0,0,0,.45); --spot:rgba(255,255,255,.07);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Hind Siliguri",system-ui,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 18% 18%,rgba(240,169,78,.26),transparent 70%),radial-gradient(35% 35% at 88% 12%,rgba(130,140,255,.18),transparent 70%),radial-gradient(40% 40% at 70% 92%,rgba(110,200,190,.16),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.025em}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,[role=switch]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1260px;margin:0 auto;padding:18px clamp(14px,3vw,34px) 40px}
nav.top{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;letter-spacing:-.01em;margin-right:auto}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--pill);display:grid;place-items:center}
.logo i::after{content:"";width:11px;height:11px;border-radius:3px;background:var(--amber);transform:rotate(45deg)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--bd);overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;border-radius:99px;padding:8px 18px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;transition:.25s var(--ease)}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--pill);color:var(--pill-ink)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.seg{display:flex;padding:3px;border-radius:99px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--bd)}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);transition:.25s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .25s var(--ease)}
.ic:hover{transform:translateY(-2px)}.ic:active{transform:scale(.95)}
.ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic .bdg{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--card)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--amber),#a9a9c4);display:grid;place-items:center;font-weight:700;color:#111;font-size:.85rem}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{margin:0;font-size:1.75rem;letter-spacing:-.03em;line-height:1.2;font-weight:600}
.head p{margin:4px 0 0;color:var(--muted)}
.head .dt{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.go{border:0;border-radius:99px;background:var(--pill);color:var(--pill-ink);padding:11px 22px;cursor:pointer;font-weight:600;transition:transform .25s var(--ease),box-shadow .25s}
.go:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.25)}.go:active{transform:scale(.97)}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:20px 22px;min-width:0;animation:rise .9s var(--ease) both;animation-delay:calc(var(--i,0)*80ms);transition:transform .35s var(--ease),box-shadow .35s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 0 #fff inset,0 24px 48px rgba(20,20,30,.13)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--mx,-999px) var(--my,-999px),var(--spot),transparent 65%)}
.card:hover::after{opacity:1}
.card h2{font-size:.95rem;font-weight:600;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:-.01em}
.mut{color:var(--muted);font-size:.8rem;font-weight:400}
.hero{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:16px;margin-bottom:16px}
.big b{display:block;font-size:2.4rem;font-weight:600;margin:6px 0 12px;line-height:1.1}
.chip{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:99px;font-size:.76rem;font-weight:600;background:var(--ok-bg);color:var(--ok-ink)}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pill);position:relative;overflow:hidden;animation:wipe 1.4s var(--ease) .6s both}
.bar.a i{background:var(--amber)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.4s ease-in-out 2.2s infinite}
.flow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:20px}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.78rem;text-align:center;flex:1;font-weight:500}
.step span{width:42px;height:42px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:grid;place-items:center;font-weight:700;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.step:nth-child(1) span{animation-delay:.6s}.step:nth-child(3) span{animation-delay:.85s}.step:nth-child(5) span{animation-delay:1.1s}.step:nth-child(7) span{animation-delay:1.35s}
.step.bad span{background:var(--bad-bg);color:var(--bad-ink);animation:pop .6s cubic-bezier(.3,1.5,.5,1) 1.1s both,ring 2.2s ease-out 2s infinite}
.ln{height:2px;background:var(--line);flex:.5;margin-top:-22px;transform-origin:left;animation:wipeX .5s var(--ease) both}
.ln:nth-child(2){animation-delay:.75s}.ln:nth-child(4){animation-delay:1s}.ln:nth-child(6){animation-delay:1.25s}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#2DB84D;margin-right:7px;animation:blink 1.8s ease-in-out infinite}
.row2{display:grid;grid-template-columns:.9fr 1.1fr 1.6fr;gap:16px;margin-bottom:16px}
.col{display:grid;gap:16px}
.kpi{display:flex;flex-direction:column;justify-content:space-between;min-height:130px}
.kpi .v{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.kpi b{font-size:1.9rem;font-weight:600;display:block;line-height:1.15}
.spark{display:flex;gap:2px;align-items:flex-end;height:36px}
.spark i{width:2px;background:var(--ink);opacity:.75;border-radius:1px;transform-origin:bottom;animation:up .8s var(--ease) both;animation-delay:calc(.6s + var(--k,0)*30ms)}
.arrow{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:.8rem;font-weight:400}
.hb{display:grid;gap:13px;margin-top:16px}
.hb div{display:flex;align-items:center}
.hb em{font-style:normal;font-size:.78rem;color:var(--muted);width:104px;flex:none}
.hb span{height:26px;border-radius:99px;background:var(--pill);color:var(--pill-ink);font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:flex-end;padding:0 11px;min-width:58px;animation:wipe 1.4s var(--ease) .6s both}
.hb div:nth-child(2) span{animation-delay:.75s}.hb div:nth-child(3) span{animation-delay:.9s}.hb div:nth-child(4) span{animation-delay:1.05s}
.wfs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.wf{background:var(--soft);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;transition:transform .25s var(--ease)}
.wf:hover{transform:translateY(-3px)}
.wf .t{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.wf strong{font-weight:600;font-size:.86rem;line-height:1.3}
.wf .n{font-size:1.3rem;font-weight:600}
.sw{width:40px;height:23px;border-radius:99px;border:0;background:var(--track);position:relative;cursor:pointer;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .25s var(--ease)}
.sw[aria-checked="true"]{background:var(--pill)}
.sw[aria-checked="true"]::after{left:20px;background:var(--pill-ink)}
.row3{display:grid;grid-template-columns:1.9fr 1fr;gap:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.filters select,.filters input{background:var(--soft);border:1px solid var(--bd);border-radius:99px;padding:8px 14px}
.filters input{flex:1;min-width:130px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:540px}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:.86rem}
th{font-weight:500;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border:0}
tbody tr{transition:background .2s}tbody tr:hover{background:rgba(127,127,140,.08)}
tr.new{animation:flash 2s ease-out}
.pill{padding:3px 12px;border-radius:99px;font-size:.75rem;font-weight:600}
.s-ok{background:var(--ok-bg);color:var(--ok-ink)}.s-run{background:var(--warn-bg);color:var(--warn-ink)}.s-bad{background:var(--bad-bg);color:var(--bad-ink)}
.al{display:flex;gap:12px;padding:13px;border-radius:16px;background:var(--soft);border:1px solid var(--bd);margin-top:10px;font-size:.86rem;animation:rise .7s var(--ease) both}
.al:nth-of-type(1){animation-delay:1s}.al:nth-of-type(2){animation-delay:1.12s}.al:nth-of-type(3){animation-delay:1.24s}
.al b{display:block;font-weight:600}
.al .d{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--amber)}.al .d.r{background:#D92D20}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:26px}
#toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pill);color:var(--pill-ink);padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);font-weight:500}
#toast.show{opacity:1;transform:translate(-50%,0)}
.view{display:none}.view.on{display:block}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:16px;align-items:start}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.arch .tech{display:inline-block;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--bd)}
.arch .no{width:28px;height:28px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fld label{font-weight:600;font-size:.8rem}
.fld input,.fld select{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
.fld input[aria-invalid="true"]{border-color:#D92D20}
.err{color:#D92D20;font-size:.76rem;min-height:1.1em}
pre.api{margin:10px 0 0;padding:12px;border-radius:14px;background:var(--pill);color:var(--pill-ink);font-size:.76rem;overflow:auto;white-space:pre-wrap}
.mini{border:1px solid var(--bd);background:var(--soft);border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:.78rem;transition:.2s}.mini:hover{background:var(--pill);color:var(--pill-ink)}
td select{background:var(--soft);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;font-size:.8rem}
.rp ul{margin:8px 0 0;padding-left:18px}.rp li{margin-bottom:6px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.chart text{fill:var(--muted);font-size:11px}
.bar i{transition:width .7s var(--ease)}
.step:nth-child(9) span{animation-delay:1.6s}.ln:nth-child(8){animation-delay:1.5s}
.lpanel{display:none}.lpanel.on{display:block}
.stage{display:flex;flex-direction:column;align-items:center;width:min(440px,100%);margin:6px auto 0}
.stage.play{animation:float 4.5s ease-in-out 3.6s infinite}
@keyframes float{50%{transform:translateY(5px)}}
.heli-wrap{position:relative;width:100%;height:82px}
.heli{position:absolute;top:0;left:calc(50% - 75px);width:190px;height:auto;overflow:visible;opacity:0}
.stage.play .heli{animation:fly 1.9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fly{0%{transform:translateX(75vw) rotate(-7deg);opacity:0}15%{opacity:1}80%{transform:translateX(-6px) rotate(3deg)}100%{transform:none;opacity:1}}
.rotor,.tail{transform-box:fill-box;transform-origin:center;animation:spin .12s linear infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
.rope{width:2px;height:30px;margin-top:-16px;background:var(--muted);transform-origin:top;transform:scaleY(0)}
.stage.play .rope{animation:rope .5s ease-out 1.7s forwards}
@keyframes rope{to{transform:scaleY(1)}}
.banner{width:100%;opacity:0;filter:drop-shadow(0 18px 26px rgba(30,30,60,.18))}
.stage.play .banner{animation:bshow .3s ease 1.9s forwards}
@keyframes bshow{to{opacity:1}}
.paper-wrap{display:grid;grid-template-rows:0fr}
.stage.play .paper-wrap{animation:unroll 1.5s cubic-bezier(.3,.7,.2,1) 2s forwards}
@keyframes unroll{to{grid-template-rows:1fr}}
.paper{overflow:hidden;min-height:0;background:linear-gradient(180deg,var(--card),var(--soft));border-radius:18px 18px 0 0;border:1px solid var(--bd);border-bottom:0}
.paper-inner{display:block;padding:30px 30px 18px}
.paper-inner h1{font-size:26px;line-height:1.2;text-align:center;margin:0}
.paper-inner .sb{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 22px}
.roll{height:26px;border-radius:14px;background:linear-gradient(180deg,var(--card),var(--line));margin:0 -6px;border:1px solid var(--bd)}
.reveal{opacity:0;transform:translateY(8px)}
.stage.play .reveal{animation:revl .5s ease forwards;animation-delay:calc(3s + var(--i,0)*.07s)}
@keyframes revl{to{opacity:1;transform:none}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.req{color:var(--amber)}
.field input,.field select{width:100%;padding:12px 15px;border:1.5px solid transparent;border-radius:14px;background:var(--track);font-size:14.5px}
.field input:focus,.field select:focus{border-color:var(--amber);outline:none}
.field.invalid input,.field.invalid select{border-color:#D92D20}
.error{display:none;font-size:12px;color:#D92D20}.field.invalid .error{display:block}
.clr{display:block;margin:10px auto 0;background:none;border:0;color:var(--muted);font-size:13.5px;cursor:pointer;text-decoration:underline}
.atx{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.apibox{margin:26px auto 0;max-width:440px;font-size:.85rem;color:var(--muted)}.apibox summary{cursor:pointer}
.usage{text-align:center;margin-top:14px;font-size:.82rem}
.planbtn{border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.8rem;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap;transition:transform .25s var(--ease)}
.planbtn:hover{transform:translateY(-2px)}
.planbtn i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.planbtn.p{background:linear-gradient(135deg,#F7D27A,#E8A44A);color:#2b1c00;border:0}
.pbn{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;padding:16px 22px;border-left:4px solid var(--amber)}
.pbn .meter{flex:1;min-width:150px}.pbn .meter .bar{margin-bottom:4px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:16px 0}
.price{font-size:2rem;font-weight:600;margin:8px 0}
.feat{list-style:none;padding:0;margin:14px 0}
.feat li{padding:6px 0;display:flex;gap:10px}.feat li::before{content:"✓";font-weight:700;color:var(--amber)}
.card.hi{border:1.5px solid var(--amber)}
.recb{font-size:.7rem;font-weight:700;padding:2px 10px;border-radius:99px;background:linear-gradient(135deg,#F7D27A,#E8A44A);color:#2b1c00}
.pro{font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:99px;background:linear-gradient(135deg,#F7D27A,#E8A44A);color:#2b1c00;vertical-align:middle}
.sw[data-lock]{opacity:.45}
.yes{color:var(--ok-ink);font-weight:700}.no2{color:var(--muted)}
.prowrap{position:relative}.prowrap.locked>.rgrid{filter:blur(7px);pointer-events:none;user-select:none}
.gate{display:none}.prowrap.locked>.gate{display:flex;position:absolute;inset:0;z-index:2;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
@media (prefers-reduced-motion:reduce){.rope{transform:none}.banner,.reveal,.heli{opacity:1;transform:none}.paper-wrap{grid-template-rows:1fr}}
.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--bd)}
.rc-ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,10,16,.42);backdrop-filter:blur(7px);opacity:0;transition:opacity .3s}
.rc-ov[hidden]{display:none}.rc-ov.on{opacity:1}
.rc-box{position:relative;width:min(390px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border-radius:24px;padding:18px 18px 16px;background-color:var(--bg);background-image:linear-gradient(rgba(127,127,140,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(127,127,140,.12) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--bd);box-shadow:0 30px 70px rgba(0,0,0,.35);transform:translateY(14px) scale(.98);transition:transform .35s var(--ease)}
.rc-ov.on .rc-box{transform:none}

    var ca=String(o.created_at||""),dt=new Date(/Z|[+-]\d\d:?\d\d$/.test(ca)?ca:ca+"Z"),d=isNaN(dt)?0:Math.max(0,Math.floor((Date.now()-dt)/864e5));
    var nm=function(x){return String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"")},ii=-1;IN_EN.forEach(function(x,k){if(nm(x)===nm(o.interest))ii=k});
    return{id:o.id,n:o.name||"",e:String(o.email||"").toLowerCase(),p:String(o.phone||""),c:o.company||"",i:ii,ir:o.interest||"",s:s,t:t,v:+(o.value||o.amount||0)||0,d:d};
  }
  async function loadLeads(){
    try{
      var r=await fetch(API_URL);if(!r.ok)throw new Error(r.status);
      var data=await r.json();if(!Array.isArray(data))throw new Error("bad");
      leads=data.map(mapLead);live=true;leadsLoading=false;all();return true;
    }catch(err){live=false;leadsLoading=false;all();return false}
  }
  if(USE_BACKEND)loadLeads().then(function(ok){if(!ok)say(tx("m_off"))});
  if(USE_BACKEND)loadReport().then(function(){drawReport()});
  if(USE_BACKEND)loadNotifs();

  function setLang(l){lang=l;try{localStorage.setItem("sb-lang",l)}catch(e){}all()}
  $("bEn").onclick=function(){setLang("en")};$("bBn").onclick=function(){setLang("bn")};
  $("theme").onclick=function(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=dark?"light":"dark";
  };
  ["fWf","fSt"].forEach(function(i){$(i).onchange=drawLog});$("fQ").oninput=drawLog;
  $("runBtn").onclick=function(){
    var on=wfs.filter(function(w){return w.on});
    if(!on.length){say(tx("t_none"));return}
    var w=on[Math.floor(Math.random()*on.length)];
    logs.unshift({w:w.k,t:"tr3",m:0,d:1.0,s:"ok"});runs++;
    $("kRuns").textContent=N(runs);drawLog();
    var fr=$("log").rows[0];if(fr)fr.classList.add("new");
    say(tx(w.k)+tx("t_run"));
  };
  document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){
    document.querySelectorAll(".tab").forEach(function(x){x.removeAttribute("aria-current")});
    t.setAttribute("aria-current","page");
    var th=VS[[].indexOf.call(document.querySelectorAll(".tab"),t)];if(location.hash==="#"+th)route();else location.hash=th;
  }});
  document.querySelectorAll(".card").forEach(function(c,i){
    var vw=c.closest(".view");c.style.setProperty("--i",Math.min(vw?[].indexOf.call(vw.querySelectorAll(".card"),c):i,8));
    c.addEventListener("pointermove",function(e){var r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")});
  });
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches)document.querySelectorAll("[data-to]").forEach(function(el){
    var to=+el.dataset.to,t0=null;el.dataset.anim="1";el.textContent=N(0);
    function f(t){if(!t0)t0=t;var p=Math.min((t-t0)/1500,1),e=1-Math.pow(1-p,4);el.textContent=N(Math.round(to*e));if(p<1)requestAnimationFrame(f);else delete el.dataset.anim}
    setTimeout(function(){requestAnimationFrame(f)},500);
  });
})();
